name: "Release: Package & Publish"
# Run on version tags, the archives are what users install
on:
  push:
    tags:
      - "v*.*.*"

# No default permissions, each job sets its own
permissions: {}

# Never cancel a release that has started
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Shallow, credential-less checkout; nothing here needs git history or push access
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Release tag has to be a version, the same pattern the release notes look for
      - name: Verify release tag is a version
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      # Same Go version as go.mod, so a local build gives the same result
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Only a commit that passes the test suite, without known vulnerabilities, is released
      - name: Lint, run tests and check for vulnerabilities
        run: |
          set -euo pipefail
          make lint
          make test
          make vuln

  release:
    name: Create GitHub Release
    needs:
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags, the release notes need every commit since the previous tag
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checkout turns an annotated tag into a lightweight one, fetch it again to keep its message
      - name: Fetch annotated release tag
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # Same Go version as go.mod, so a local build gives the same result
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Static binaries for Linux, macOS and Windows in deterministic archives with the README
      - name: Package release archives
        run: |
          set -euo pipefail
          make release VERSION="${GITHUB_REF_NAME#v}"

      # A dynamic binary wouldn't run on every Linux, and one that doesn't start is no release
      - name: Verify the packaged binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="steam-adopt-$version-linux-amd64"
          tar -xzf "release/$name.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/$name/steam-adopt"
          if ldd "$bin" > /dev/null 2>&1; then
            echo "steam-adopt is dynamically linked, it must run on any Linux" >&2
            exit 1
          fi
          "$bin" --version | grep -qx "steam-adopt $version"

      # Notes from .github/cliff.toml for the tag being built
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: release-notes.md
        with:
          config: .github/cliff.toml
          args: --current --strip all

      # Tags with a suffix like v2.1.0-rc.1 become pre-releases
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
